version: '3.8'

services:
  ai-backend:
    build: .
    container_name: med_ai_backend
    command: python backend/grpc_server.py
    ports:
      - "50051:50051"
    env_file:
      - .env

  api-gateway:
    build: .
    container_name: med_api_gateway
    command: uvicorn backend.fastapi_app:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      - GRPC_HOST=ai-backend
    env_file:
      - .env
    depends_on:
      - ai-backend

  chainlit-ui:
    build: .
    container_name: med_chainlit_ui
    working_dir: /app/frontend
    command: chainlit run app.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_URL=http://api-gateway:8080/api/chat
      - CHAINLIT_PORT=8000
    env_file:
      - .env
    depends_on:
      - api-gateway
